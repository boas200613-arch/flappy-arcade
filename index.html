
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Flappy Arcade</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: monospace;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: #020617;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  min-height: 100svh;
  overflow: hidden;
  touch-action: manipulation;
}

#wrap {
  position: relative;
  width: min(400px, calc(100vw - 20px), calc((100svh - 20px) * 5 / 7));
  aspect-ratio: 5 / 7;
  border: 3px solid #38bdf8;
  border-radius: 12px;
  overflow: hidden;
  flex-shrink: 0;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  background: #0f172a;
  touch-action: none;
}

button {
  padding: 12px 22px;
  font-weight: bold;
  font-size: 15px;
  background: #22c55e;
  color: #050816;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-appearance: none;
  appearance: none;
  user-select: none;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

input {
  padding: 10px;
  text-align: center;
  text-transform: uppercase;
  background: #1e293b;
  color: white;
  border: 2px solid #38bdf8;
  border-radius: 6px;
  font-size: 16px;
  width: min(220px, 85%);
}

#ui {
  position: absolute;
  inset: 0;
  background: rgba(15,23,42,.95);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 12px;
  text-align: center;
  z-index: 5;
}

.hidden {
  display: none !important;
}

ul {
  list-style: none;
  width: min(270px, 95%);
}

li {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 6px;
  border-bottom: 1px solid #334155;
  font-size: 13px;
}

.gold {
  color: #facc15;
  font-weight: bold;
}

#status {
  color: #94a3b8;
  font-size: 11px;
  max-width: 300px;
  overflow-wrap: anywhere;
}

#intro {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  overflow: hidden;
  text-align: center;
  background: radial-gradient(circle at 50% 45%, #172554 0%, #080d25 58%, #020617 100%);
}

#intro::before,
#intro::after {
  content: "";
  position: absolute;
  width: 260px;
  height: 260px;
  border: 2px solid rgba(56,189,248,.22);
  border-radius: 50%;
  animation: intro-ring 4s linear infinite;
  pointer-events: none;
}

#intro::after {
  width: 360px;
  height: 360px;
  animation-delay: -2s;
}

#introLogo {
  z-index: 1;
  color: #facc15;
  font-size: clamp(25px, 8vw, 38px);
  text-shadow: 0 0 10px #facc15, 0 0 28px #38bdf8;
  animation: logo-float 1.2s ease-in-out infinite alternate;
}

#introBird {
  z-index: 1;
  font-size: 48px;
  animation: bird-bob .55s ease-in-out infinite alternate;
}

#introTag {
  z-index: 1;
  color: #7dd3fc;
  font-size: 12px;
  letter-spacing: 3px;
}

#introStart {
  z-index: 2;
  margin-top: 12px;
  background: #38bdf8;
  color: #020617;
  box-shadow: 0 0 18px rgba(56,189,248,.55);
  animation: button-pulse 1s ease-in-out infinite alternate;
}

#introCountdown {
  z-index: 1;
  color: #facc15;
  font-size: 14px;
  min-height: 18px;
}

#musicToggle {
  position: absolute;
  z-index: 30;
  top: 8px;
  right: 8px;
  padding: 8px 10px;
  font-size: 12px;
  background: #1e293b;
  color: white;
  border: 1px solid #38bdf8;
}

@keyframes intro-ring {
  from { transform: scale(.65); opacity: .75; }
  to { transform: scale(1.25); opacity: .05; }
}

@keyframes logo-float {
  from { transform: translateY(-5px) scale(.98); }
  to { transform: translateY(5px) scale(1.04); }
}

@keyframes bird-bob {
  from { transform: translateY(-9px) rotate(-8deg); }
  to { transform: translateY(9px) rotate(8deg); }
}

@keyframes button-pulse {
  from { transform: scale(1); }
  to { transform: scale(1.06); }
}
</style>
</head>

<body>

<div id="wrap">

  <canvas id="c" width="400" height="560"></canvas>

  <button id="musicToggle" type="button">MUSIC: ON</button>

  <div id="intro">
    <h1 id="introLogo">FLAPPY ARCADE</h1>
    <div id="introBird">🐤</div>
    <p id="introTag">GET READY TO FLY</p>
    <p id="introCountdown">START THE INTRO</p>
    <button id="introStart" type="button">START INTRO</button>
  </div>

  <audio id="startupMusic" src="flappy_arcade_theme.wav" preload="auto"></audio>
  <audio id="gameMusic" src="flappy_arcade_game_music.wav" preload="auto" loop></audio>

  <div id="ui" class="hidden">
    <h1 id="t" style="color:#facc15">FLAPPY ARCADE</h1>

    <p style="color:#94a3b8;font-size:13px">
      Tap, click or press SPACE to fly
    </p>

    <p id="fs" class="hidden" style="font-size:17px"></p>

    <input id="n" maxlength="10" placeholder="YOUR NAME">

    <h3 style="color:#38bdf8">ONLINE TOP 5 LEADERBOARD</h3>

    <ul id="lb"></ul>

    <p id="status">Loading online leaderboard...</p>

    <button id="btn" type="button">PLAY NOW</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

// ============================================
// SUPABASE
// ============================================

const SUPABASE_URL = "https://ilgdnvtdmzjrclybbexi.supabase.co";
const SUPABASE_KEY = "sb_publishable_6kZmesu_W4jgVmDKDw6v8Q_Y5SlesV0";

let db = null;

try {
  if (window.supabase) {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
} catch (error) {
  console.error("Supabase error:", error);
}

// ============================================
// ELEMENTS
// ============================================

const c = document.getElementById("c");
const ctx = c.getContext("2d");

const ui = document.getElementById("ui");
const t = document.getElementById("t");
const fs = document.getElementById("fs");
const n = document.getElementById("n");
const lb = document.getElementById("lb");
const btn = document.getElementById("btn");
const status = document.getElementById("status");

const intro = document.getElementById("intro");
const introStart = document.getElementById("introStart");
const introCountdown = document.getElementById("introCountdown");

const startupMusic = document.getElementById("startupMusic");
const gameMusic = document.getElementById("gameMusic");
const musicToggle = document.getElementById("musicToggle");

// ============================================
// LOCAL STORAGE
// ============================================

function safeGet(key) {
  try {
    return localStorage.getItem(key) || "";
  } catch {
    return "";
  }
}

function safeSet(key, value) {
  try {
    localStorage.setItem(key, value);
  } catch (error) {
    console.warn("Storage unavailable:", error);
  }
}

n.value = safeGet("flappy_name");

let playerId = safeGet("flappy_player_id");

if (!playerId) {
  playerId = (
    crypto.randomUUID
      ? crypto.randomUUID()
      : "player-" + Date.now() + "-" + Math.random().toString(36).slice(2)
  );

  safeSet("flappy_player_id", playerId);
}

// ============================================
// MUSIC
// ============================================

let musicEnabled = true;

function updateMusicButton() {
  musicToggle.textContent = musicEnabled ? "MUSIC: ON" : "MUSIC: OFF";
}

function pauseAllMusic() {
  startupMusic.pause();
  gameMusic.pause();
}

function startGameMusic() {
  if (!musicEnabled) return;

  startupMusic.pause();
  gameMusic.volume = 0.45;
  gameMusic.currentTime = 0;

  gameMusic.play().catch(error => {
    console.log("Game music could not start:", error);
  });
}

function toggleMusic() {
  musicEnabled = !musicEnabled;
  updateMusicButton();

  if (!musicEnabled) {
    pauseAllMusic();
    return;
  }

  if (gameRunning) {
    startGameMusic();
  } else if (!intro.classList.contains("hidden")) {
    startupMusic.volume = 0.85;

    startupMusic.play().catch(error => {
      console.log("Intro music could not start:", error);
    });
  }
}

musicToggle.addEventListener("click", toggleMusic);

// ============================================
// INTRO
// ============================================

let introRunning = false;

function beginIntro() {
  if (introRunning) return;

  introRunning = true;
  introStart.disabled = true;
  introStart.textContent = "STARTING...";
  introCountdown.textContent = "5";

  if (musicEnabled) {
    startupMusic.currentTime = 0;
    startupMusic.volume = 0.85;

    startupMusic.play().catch(error => {
      console.log("Intro music unavailable:", error);
    });
  }

  const startedAt = Date.now();

  const countdownTimer = setInterval(() => {
    const elapsed = (Date.now() - startedAt) / 1000;
    const remaining = Math.max(0, 5 - Math.floor(elapsed));

    introCountdown.textContent =
      remaining > 0 ? String(remaining) : "LET'S FLY!";

    if (elapsed >= 4.4 && musicEnabled) {
      startupMusic.volume = Math.max(0, 0.85 * (5 - elapsed) / 0.6);
    }
  }, 50);

  setTimeout(() => {
    clearInterval(countdownTimer);

    startupMusic.pause();
    startupMusic.currentTime = 0;
    startupMusic.volume = 0.85;

    intro.classList.add("hidden");
    ui.classList.remove("hidden");
  }, 5000);
}

introStart.addEventListener("click", beginIntro);

// ============================================
// GAME VARIABLES
// ============================================

let bird;
let pipes = [];
let score = 0;
let over = true;
let fc = 0;
let animId = 0;

let playerName = "PLAYER";
let gameRunning = false;
let startingGame = false;
let currentRunId = null;

let lives = 3;
let invulnerable = false;
let invulnerableTimer = 0;
let respawning = false;
let respawnTimer = 0;
let scoreSaved = false;

// ============================================
// REPLAY RECORDING
// ============================================

let replaySeed = 0;
let replayEvents = [];
let replayKeyframes = [];
let replayStride = 10;
let replayRecording = false;

function recordReplayEvent(event) {
  if (!replayRecording) return;
  if (replayEvents.length >= 24999) return;

  replayEvents.push({
    ...event,
    tick: fc
  });
}

function captureReplayFrame(force = false) {
  if (!replayRecording || !bird) return;
  if (!force && fc % replayStride !== 0) return;

  if (replayKeyframes.length >= 2900 && replayStride < 1000) {
    replayStride = Math.min(replayStride * 2, 1000);
  }

  if (replayKeyframes.length >= 3000) return;

  replayKeyframes.push({
    tick: fc,
    x: bird.x,
    y: Math.round(bird.y * 100) / 100,
    v: Math.round(bird.v * 100) / 100,
    score,
    lives,
    inv: invulnerable ? 1 : 0,
    resp: respawning ? 1 : 0,

    pipes: pipes.map(p => ({
      x: Math.round(p.x * 100) / 100,
      top: p.top,
      bot: p.bot,
      w: p.w,
      passed: p.passed ? 1 : 0
    }))
  });
}

function resetReplayRecording() {
  replaySeed = Math.floor(Math.random() * 2000000000);
  replayEvents = [];
  replayKeyframes = [];
  replayStride = 10;
  replayRecording = true;
}

// ============================================
// STATUS
// ============================================

function setStatus(message) {
  status.textContent = message;
}

// ============================================
// LEADERBOARD
// ============================================

function showLB(list, currentName = "", currentScore = -1) {
  lb.innerHTML = "";

  if (!list || list.length === 0) {
    const li = document.createElement("li");
    li.textContent = "No scores yet";
    lb.appendChild(li);
    return;
  }

  list.forEach((item, index) => {
    const li = document.createElement("li");

    if (
      index === 0 ||
      (item.name === currentName && item.score === currentScore)
    ) {
      li.className = "gold";
    }

    const left = document.createElement("span");
    left.textContent = (index + 1) + ". " + item.name;

    const right = document.createElement("span");
    right.textContent = item.score;

    li.appendChild(left);
    li.appendChild(right);
    lb.appendChild(li);
  });
}

async function loadLeaderboard(currentName = "", currentScore = -1) {
  if (!db) {
    setStatus("Supabase is unavailable.");
    showLB([]);
    return;
  }

  try {
    const { data, error } = await db
      .from("flappy_scores")
      .select("name, score")
      .order("score", { ascending: false })
      .order("created_at", { ascending: true })
      .limit(5);

    if (error) throw error;

    showLB(data, currentName, currentScore);
    setStatus("ONLINE - Scores shared with everyone");

  } catch (error) {
    console.error("Leaderboard loading failed:", error);
    setStatus("Loading error: " + error.message);
  }
}

// ============================================
// GAME BACKEND REQUESTS
// ============================================

async function gameRequest(action, extra = {}) {
  if (!db) throw new Error("Supabase is unavailable.");

  const { data, error } = await db.functions.invoke("admin-boas", {
    body: { action, ...extra }
  });

  if (error) {
    let message = error.message || "Request failed.";

    try {
      if (error.context && typeof error.context.clone === "function") {
        const responseBody = await error.context.clone().json();

        if (responseBody && responseBody.error) {
          message = responseBody.error;
        }
      }
    } catch (_) {}

    throw new Error(message);
  }

  if (data && data.error) {
    throw new Error(data.error);
  }

  return data;
}

// ============================================
// SAVE REPLAY AND SCORE
// ============================================

async function saveScore(name, newScore) {
  if (!db || !currentRunId) {
    setStatus("Score not saved. Please play again.");
    return;
  }

  const runIdToSave = currentRunId;

  try {
    replayRecording = false;

    const replayData = {
      version: 1,
      seed: replaySeed,
      durationTicks: Math.max(1, fc),
      jumpCount: replayEvents.filter(event => event.type === "jump").length,
      events: replayEvents,
      keyframes: replayKeyframes
    };

    await gameRequest("save-replay", {
      runId: runIdToSave,
      playerId,
      replay: replayData
    });

    console.log("Replay saved successfully.");

  } catch (replayError) {
    console.error("Replay saving failed:", replayError);
    setStatus("Replay could not be saved. Saving score...");
  }

  try {
    const result = await gameRequest("finish-run", {
      runId: runIdToSave,
      playerId,
      name,
      score: newScore
    });

    currentRunId = null;

    if (!result || !result.success) {
      throw new Error(result?.error || "Score could not be saved.");
    }

    setStatus("Score and game result saved online!");
    await loadLeaderboard(name, newScore);

  } catch (error) {
    console.error("Score saving failed:", error);
    currentRunId = null;
    setStatus("Score not saved: " + error.message);
  }
}

// ============================================
// DRAW LIVES
// ============================================

function drawLives() {
  ctx.save();
  ctx.font = "bold 22px monospace";
  ctx.textAlign = "left";
  ctx.fillStyle = "#ef4444";

  let hearts = "";

  for (let i = 0; i < 3; i++) {
    hearts += i < lives ? "♥ " : "♡ ";
  }

  ctx.fillText(hearts, 12, 38);
  ctx.restore();
}

// ============================================
// START GAME
// ============================================

async function start() {
  if (gameRunning || startingGame) return;

  startingGame = true;
  startGameMusic();

  try {
    playerName = (n.value.trim() || "PLAYER")
      .replace(/[^a-zA-Z0-9_-]/g, "")
      .slice(0, 10)
      .toUpperCase() || "PLAYER";

    n.value = playerName;
    safeSet("flappy_name", playerName);

    setStatus("Checking game...");

    const runResult = await gameRequest("start-run", {
      playerId,
      playerName
    });

    if (!runResult || !runResult.runId) {
      throw new Error("The server could not start a game round.");
    }

    currentRunId = runResult.runId;

    resetReplayRecording();

    gameRunning = true;

    bird = {
      x: 90,
      y: 250,
      r: 14,
      v: 0,
      g: 0.42,
      j: -7.4
    };

    pipes = [];
    score = 0;
    fc = 0;
    over = false;

    lives = 3;
    invulnerable = false;
    invulnerableTimer = 0;
    respawning = false;
    respawnTimer = 0;
    scoreSaved = false;

    t.textContent = "FLAPPY ARCADE";
    t.style.color = "#facc15";

    fs.classList.add("hidden");
    btn.textContent = "PLAY AGAIN";

    ui.classList.add("hidden");

    setStatus("Have fun playing!");

    captureReplayFrame(true);

    cancelAnimationFrame(animId);
    loop();

  } catch (error) {
    gameRunning = false;
    currentRunId = null;
    replayRecording = false;
    gameMusic.pause();

    console.error("Game start failed:", error);

    ui.classList.remove("hidden");
    setStatus(error.message || "Game could not start.");

  } finally {
    startingGame = false;
  }
}

// ============================================
// PLAY BUTTON
// ============================================

let lastStartInput = 0;

function startFromButton(event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  const now = Date.now();

  if (now - lastStartInput < 700) return;

  lastStartInput = now;
  start();
}

btn.addEventListener("pointerup", startFromButton);
btn.addEventListener("click", startFromButton);

// ============================================
// BIRD FLAP
// ============================================

function flap(event) {
  if (event) event.preventDefault();

  if (!over && bird && !respawning) {
    bird.v = bird.j;

    recordReplayEvent({
      type: "jump",
      y: Math.round(bird.y * 100) / 100,
      score,
      lives
    });

    captureReplayFrame(true);
  }
}

// ============================================
// LOSE LIFE
// ============================================

function loseLife(cause = "unknown") {
  if (over || invulnerable || respawning) return;

  const livesBefore = lives;
  lives--;

  recordReplayEvent({
    type: "collision",
    cause,
    livesBefore,
    livesAfter: lives,
    score
  });

  if (lives <= 0) {
    lives = 0;
    die();
    return;
  }

  bird.y = 250;
  bird.v = 0;

  invulnerable = true;
  invulnerableTimer = 100;
  respawning = true;
  respawnTimer = 35;

  pipes = pipes.filter(p => p.x > bird.x + 100);

  captureReplayFrame(true);

  console.log("Life lost. Remaining lives:", lives);
}

// ============================================
// GAME OVER
// ============================================

function die() {
  if (over) return;

  over = true;
  gameRunning = false;

  gameMusic.pause();
  gameMusic.currentTime = 0;

  recordReplayEvent({
    type: "game_over",
    score,
    lives
  });

  captureReplayFrame(true);

  t.textContent = "GAME OVER";
  t.style.color = "#ef4444";

  fs.textContent =
    playerName + " - Score: " + score + " - Lives: " + lives;

  fs.classList.remove("hidden");

  btn.textContent = "PLAY AGAIN";
  ui.classList.remove("hidden");

  if (!scoreSaved) {
    scoreSaved = true;
    setStatus("Saving score and replay online...");
    saveScore(playerName, score);
  }
}

// ============================================
// GAME LOOP
// ============================================

function loop() {
  if (over) return;

  ctx.clearRect(0, 0, 400, 560);

  if (respawning) {
    respawnTimer--;

    if (respawnTimer <= 0) {
      respawning = false;
    }
  }

  if (invulnerable) {
    invulnerableTimer--;

    if (invulnerableTimer <= 0) {
      invulnerable = false;
    }
  }

  if (!respawning) {
    bird.v += bird.g;
    bird.y += bird.v;
  }

  // Create obstacles.
  if (fc % 95 === 0) {
    const gap = 130;

    const topHeight =
      Math.floor(Math.random() * (560 - gap - 120)) + 60;

    pipes.push({
      x: 400,
      top: topHeight,
      bot: topHeight + gap,
      w: 52,
      passed: false
    });
  }

  ctx.fillStyle = "#22c55e";

  for (let i = pipes.length - 1; i >= 0; i--) {
    const p = pipes[i];

    p.x -= 2.8;

    ctx.fillRect(p.x, 0, p.w, p.top);
    ctx.fillRect(p.x, p.bot, p.w, 560 - p.bot);

    if (
      !invulnerable &&
      !respawning &&
      bird.x + bird.r > p.x &&
      bird.x - bird.r < p.x + p.w &&
      (
        bird.y - bird.r < p.top ||
        bird.y + bird.r > p.bot
      )
    ) {
      loseLife("pipe");
      break;
    }

    if (!p.passed && p.x + p.w < bird.x) {
      p.passed = true;
      score++;

      recordReplayEvent({
        type: "score",
        score
      });

      captureReplayFrame(true);
    }

    if (p.x + p.w < 0) {
      pipes.splice(i, 1);
    }
  }

  if (over) return;

  // Boundary collision.
  if (
    !invulnerable &&
    !respawning &&
    (bird.y + bird.r > 560 || bird.y - bird.r < 0)
  ) {
    loseLife("boundary");
  }

  if (over) return;

  // Draw bird.
  if (!invulnerable || Math.floor(fc / 5) % 2 === 0) {
    ctx.fillStyle = "#facc15";
    ctx.beginPath();
    ctx.arc(bird.x, bird.y, bird.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(bird.x + 5, bird.y - 4, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#020617";
    ctx.beginPath();
    ctx.arc(bird.x + 6, bird.y - 4, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Score.
  ctx.fillStyle = "#fff";
  ctx.font = "bold 26px monospace";
  ctx.textAlign = "center";
  ctx.fillText(score, 200, 45);

  drawLives();

  if (respawning) {
    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 18px monospace";
    ctx.textAlign = "center";
    ctx.fillText("READY TO FLY AGAIN!", 200, 300);
  }

  fc++;

  captureReplayFrame(false);

  animId = requestAnimationFrame(loop);
}

// ============================================
// MOBILE CONTROLS
// ============================================

c.addEventListener("pointerdown", function(event) {
  event.preventDefault();
  flap();
}, { passive: false });

// ============================================
// KEYBOARD CONTROLS
// ============================================

document.addEventListener("keydown", function(event) {
  if (
    event.code === "Space" ||
    event.code === "ArrowUp"
  ) {
    event.preventDefault();

    if (!ui.classList.contains("hidden")) {
      start();
    } else {
      flap();
    }
  }
});

// ============================================
// ERROR HANDLING
// ============================================

window.addEventListener("error", function(event) {
  console.error("JavaScript error:", event.message);
});

window.addEventListener("unhandledrejection", function(event) {
  console.error("Unhandled promise rejection:", event.reason);
});

// ============================================
// INITIALIZE
// ============================================

updateMusicButton();
loadLeaderboard();

</script>
</body>
</html>
