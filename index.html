
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flappy Arcade</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;text-align:center}
h1{margin:18px 0;color:#70d6ff}
h3{margin-bottom:10px}
#game{display:block;width:min(94vw,400px);height:auto;margin:15px auto;background:#8ed8ff;border:4px solid #fff;border-radius:14px;touch-action:manipulation}
.panel{background:#1c293b;padding:16px;margin:12px auto;border-radius:12px;width:min(94%,430px)}
input,button,select{padding:11px;border:0;border-radius:8px;margin:4px;font-size:15px}
input{width:190px}
button{background:#70d6ff;color:#101827;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.1)}
button:disabled{opacity:.45;cursor:not-allowed}
.mode-button{min-width:130px}
.mode-button.selected{background:#8ac926;outline:3px solid white}
#status{color:#a9e7ff;min-height:22px}
#admin{display:none}
#players{text-align:left;max-height:180px;overflow:auto}
.player{padding:8px;margin:4px;background:#293b52;border-radius:7px;cursor:pointer}
.player.selected{outline:2px solid #70d6ff}
.small{font-size:12px;color:#b7c5d8}
#leaderboard p{margin:8px}
#modeStatus{color:#a9e7ff;min-height:20px}
</style>
</head>
<body>

<h1>🐤 Flappy Arcade</h1>

<div class="panel" id="menu">
  <h2>Choose your game mode</h2>
  <button class="mode-button" id="trainingBtn">TRAINING</button>
  <button class="mode-button" id="multiplayerBtn">MULTIPLAYER</button>
  <p id="modeStatus">Select a game mode to continue.</p>

  <input id="playerName" maxlength="10" placeholder="Your name">
  <br>
  <button id="playBtn" disabled>PLAY</button>

  <p id="status">Connecting...</p>

  <h3>🏆 Online Top 5</h3>
  <div id="leaderboard">Loading leaderboard...</div>
</div>

<canvas id="game" width="400" height="560"></canvas>

<div class="panel">
  <button id="restartBtn">BACK TO MENU</button>
  <button id="soundBtn">Sound: Off</button>
  <p class="small">Tap or press SPACE to flap.</p>
</div>

<div class="panel" id="admin">
  <h2>Admin Panel</h2>
  <p id="adminStatus">Admin active</p>

  <h3>Active players</h3>
  <div id="players">No players online</div>
  <div id="selectedInfo">Select a player.</div>

  <h3>Temporarily ban player</h3>
  <select id="banDuration">
    <option value="5">5 minutes</option>
    <option value="60">1 hour</option>
    <option value="1440">24 hours</option>
    <option value="10080">7 days</option>
    <option value="43200">30 days</option>
    <option value="custom">Custom</option>
  </select>

  <input id="customMinutes" type="number" min="1" max="525600" placeholder="Minutes">
  <input id="banReason" maxlength="120" placeholder="Reason (optional)">
  <br>

  <button id="banBtn">Ban player</button>
  <button id="unbanBtn">Remove ban</button>
  <button id="refreshBans">Refresh bans</button>

  <div id="banList"></div>
  <button id="adminLogout">Log out</button>
</div>

<script>
const SUPABASE_URL = "https://ilgdnvtdmzjrclybbexi.supabase.co";
const SUPABASE_KEY = "sb_publishable_6kZmesu_W4jgVmDKDw6v8Q_Y5SlesV0";
const FUNCTION_URL = SUPABASE_URL + "/functions/v1/admin-boas";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");

const colors = [
  "#ff595e","#ffca3a","#8ac926","#1982c4",
  "#c77dff","#ff924c","#00f5d4","#f15bb5","#ffffff"
];

const playerId = (() => {
  let id = localStorage.getItem("flappy_player_id");

  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem("flappy_player_id", id);
  }

  return id;
})();

const playerColor =
  localStorage.getItem("flappy_player_color") ||
  colors[Math.floor(Math.random() * colors.length)];

localStorage.setItem("flappy_player_color", playerColor);

let playerName = "";
let selectedMode = null;

let channel = null;
let remotePlayers = [];
let selectedPlayer = null;

let adminCode = null;
let isAdmin = false;

let gameRunning = false;
let gameOver = false;

let score = 0;
let pipes = [];
let lastPipe = 0;

let soundOn = false;
let audioContext = null;

let runId = null;

let bird = {x:85,y:260,vy:0};

const gravity = 0.42;
const jump = -7.4;


/* SERVER */

async function callFunction(action, extra = {}) {
  const response = await fetch(FUNCTION_URL, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({action, ...extra})
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(data.error || "Server error");
  }

  return data;
}

function setStatus(message) {
  statusEl.textContent = message;
}


/* GAME MODE */

function selectMode(mode) {
  if (gameRunning) return;

  selectedMode = mode;

  document.getElementById("trainingBtn")
    .classList.toggle("selected", mode === "training");

  document.getElementById("multiplayerBtn")
    .classList.toggle("selected", mode === "multiplayer");

  document.getElementById("playBtn").disabled = false;

  if (mode === "training") {
    document.getElementById("modeStatus").textContent =
      "Training mode: your score will not be uploaded.";
  } else {
    document.getElementById("modeStatus").textContent =
      "Multiplayer mode: your score will be saved online.";
  }

  setStatus("Ready to play.");
}


/* BAN CHECK */

async function checkBan() {
  const result = await callFunction("check-ban", {playerId});

  if (result.banned) {
    setStatus(
      "You are temporarily banned until " +
      new Date(result.expiresAt).toLocaleString("en-GB")
    );

    document.getElementById("playBtn").disabled = true;
    return true;
  }

  document.getElementById("playBtn").disabled = !selectedMode;
  return false;
}


/* MULTIPLAYER PRESENCE */

async function connectMultiplayer() {
  channel = db.channel("flappy-live", {
    config: {presence: {key: playerId}}
  });

  channel.on("presence", {event:"sync"}, () => {
    const state = channel.presenceState();
    remotePlayers = [];

    for (const key of Object.keys(state)) {
      for (const item of state[key]) {
        if (item.playerId !== playerId && item.playing) {
          remotePlayers.push(item);
        }
      }
    }

    renderPlayerList();
  });

  channel.subscribe(async state => {
    if (state === "SUBSCRIBED") {
      setStatus("Connected to multiplayer.");
      await publishPresence();
    }
  });
}

async function publishPresence() {
  if (!channel) return;

  await channel.track({
    playerId,
    name: playerName || "Player",
    color: playerColor,
    x: bird.x,
    y: bird.y,
    score,
    playing: gameRunning && selectedMode === "multiplayer",
    updatedAt: Date.now()
  });
}

async function updatePresence() {
  if (!channel || selectedMode !== "multiplayer") return;

  await channel.track({
    playerId,
    name: playerName || "Player",
    color: playerColor,
    x: bird.x,
    y: bird.y,
    score,
    playing: gameRunning,
    updatedAt: Date.now()
  });
}


/* ADMIN PLAYER LIST */

function renderPlayerList() {
  if (!isAdmin) return;

  const container = document.getElementById("players");
  container.innerHTML = "";

  if (!remotePlayers.length) {
    container.textContent = "No other active players.";
    return;
  }

  remotePlayers.forEach(p => {
    const item = document.createElement("div");

    item.className = "player" +
      (selectedPlayer?.playerId === p.playerId ? " selected" : "");

    item.textContent = p.name + " – Score: " + p.score;
    item.style.borderLeft = "7px solid " + (p.color || "#ffffff");

    item.onclick = () => {
      selectedPlayer = p;

      document.getElementById("selectedInfo").textContent =
        "Selected: " + p.name +
        " | ID: " + p.playerId +
        " | Score: " + p.score;

      renderPlayerList();
    };

    container.appendChild(item);
  });
}


/* START GAME */

async function startGame() {
  if (gameRunning) return;

  if (!selectedMode) {
    setStatus("Please choose Training or Multiplayer first.");
    return;
  }

  try {
    if (await checkBan()) return;
  } catch (error) {
    setStatus("Could not check ban status: " + error.message);
    return;
  }

  playerName = document.getElementById("playerName").value
    .trim()
    .replace(/[^a-zA-Z0-9_-]/g, "")
    .slice(0,10)
    .toUpperCase();

  if (!playerName) {
    setStatus("Please enter your name.");
    return;
  }

  runId = null;

  if (selectedMode === "multiplayer") {
    try {
      const result = await callFunction("start-run", {playerId});
      runId = result.runId;
    } catch (error) {
      setStatus("Could not start multiplayer: " + error.message);
      return;
    }
  }

  document.getElementById("menu").style.display = "none";

  bird = {x:85,y:260,vy:0};
  score = 0;
  pipes = [];
  lastPipe = 0;

  gameOver = false;
  gameRunning = true;

  if (selectedMode === "multiplayer") {
    await updatePresence();
  } else if (channel) {
    await publishPresence();
  }
}


/* END GAME */

async function endGame() {
  if (!gameRunning) return;

  gameRunning = false;
  gameOver = true;

  if (selectedMode === "multiplayer") {
    await updatePresence();

    if (runId) {
      try {
        await callFunction("finish-run", {
          playerId,
          runId,
          name: playerName,
          score
        });

        await loadLeaderboard();
        setStatus("Game over! Score saved: " + score);
      } catch (error) {
        setStatus("Score could not be saved: " + error.message);
      }
    }
  } else {
    if (channel) await publishPresence();
    setStatus("Training finished! Score: " + score);
  }

  runId = null;
  document.getElementById("menu").style.display = "block";
}


/* SOUND */

function playSound(frequency = 500, duration = 0.08) {
  if (!soundOn) return;

  try {
    audioContext ||= new (window.AudioContext || window.webkitAudioContext)();

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.frequency.value = frequency;
    oscillator.type = "sine";

    gain.gain.setValueAtTime(0.08, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + duration);
  } catch (error) {
    console.warn("Audio unavailable:", error);
  }
}


/* GAME LOGIC */

function flap() {
  if (!gameRunning) return;

  bird.vy = jump;
  playSound(650);
}

function addPipe() {
  const gap = 155;
  const top = 60 + Math.random() * 220;

  pipes.push({
    x:410,
    top,
    gap,
    passed:false
  });
}

function drawBird(x,y,color,label) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x,y,13,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#172033";
  ctx.beginPath();
  ctx.arc(x+4,y-4,2.5,0,Math.PI*2);
  ctx.fill();

  if (label) {
    ctx.fillStyle = "#102033";
    ctx.font = "11px Arial";
    ctx.textAlign = "center";
    ctx.fillText(label,x,y-19);
  }
}

function draw() {
  ctx.clearRect(0,0,400,560);

  ctx.fillStyle = "#8ed8ff";
  ctx.fillRect(0,0,400,560);

  ctx.fillStyle = "#d8f5ff";
  ctx.beginPath();
  ctx.arc(70,90,28,0,Math.PI*2);
  ctx.arc(100,90,22,0,Math.PI*2);
  ctx.arc(125,90,28,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#6fc34a";
  ctx.fillRect(0,520,400,40);

  pipes.forEach(p => {
    ctx.fillStyle = "#269b48";
    ctx.fillRect(p.x,0,55,p.top);
    ctx.fillRect(p.x,p.top+p.gap,55,520-(p.top+p.gap));

    ctx.fillStyle = "#167c38";
    ctx.fillRect(p.x-5,p.top-16,65,16);
    ctx.fillRect(p.x-5,p.top+p.gap,65,16);
  });

  if (gameRunning || gameOver) {
    drawBird(bird.x,bird.y,playerColor,playerName);
  }

  if (selectedMode === "multiplayer" || isAdmin) {
    remotePlayers.forEach(p => {
      drawBird(
        Number(p.x) || 85,
        Number(p.y) || 260,
        p.color || "#ffffff",
        p.name
      );
    });
  }

  ctx.fillStyle = "#102033";
  ctx.font = "bold 30px Arial";
  ctx.textAlign = "center";
  ctx.fillText(String(score),200,45);

  if (!gameRunning && !gameOver) {
    ctx.font = "bold 23px Arial";
    ctx.fillText("FLAPPY ARCADE",200,250);

    ctx.font = "16px Arial";
    ctx.fillText("Choose a mode and press PLAY",200,285);
  }

  if (gameOver) {
    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.fillRect(0,0,400,560);

    ctx.fillStyle = "white";
    ctx.font = "bold 34px Arial";
    ctx.fillText("GAME OVER",200,260);

    ctx.font = "22px Arial";
    ctx.fillText("Score: " + score,200,300);
  }
}

function update() {
  if (gameRunning) {
    bird.vy += gravity;
    bird.y += bird.vy;

    if (Date.now() - lastPipe > 1500) {
      addPipe();
      lastPipe = Date.now();
    }

    pipes.forEach(p => {
      p.x -= 2.5;

      if (!p.passed && p.x + 55 < bird.x) {
        p.passed = true;
        score++;
        playSound(850,0.05);
      }

      const withinX =
        bird.x + 11 > p.x &&
        bird.x - 11 < p.x + 55;

      const outsideGap =
        bird.y - 11 < p.top ||
        bird.y + 11 > p.top + p.gap;

      if (withinX && outsideGap && gameRunning) {
        endGame();
      }
    });

    pipes = pipes.filter(p => p.x > -70);

    if ((bird.y > 508 || bird.y < 0) && gameRunning) {
      endGame();
    }

    if (selectedMode === "multiplayer" && Math.random() < 0.08) {
      updatePresence();
    }
  }

  draw();
  requestAnimationFrame(update);
}


/* LEADERBOARD */

async function loadLeaderboard() {
  try {
    const {data,error} = await db
      .from("flappy_scores")
      .select("name,score")
      .order("score",{ascending:false})
      .limit(5);

    if (error) throw error;

    const el = document.getElementById("leaderboard");
    el.innerHTML = "";

    (data || []).forEach((s,i) => {
      const row = document.createElement("p");
      row.textContent = (i+1) + ". " + s.name + " – " + s.score;
      el.appendChild(row);
    });

    if (!data?.length) {
      el.textContent = "No scores yet.";
    }
  } catch (error) {
    document.getElementById("leaderboard").textContent =
      "Leaderboard unavailable.";
  }
}


/* ADMIN */

async function adminAction(action, extra={}) {
  if (!adminCode) {
    throw new Error("Not logged in.");
  }

  return callFunction(action,{adminCode,...extra});
}

async function loginAdmin() {
  const code = prompt("Enter the admin code:");

  if (!code) return;

  try {
    await callFunction("verify",{adminCode:code});

    adminCode = code;
    isAdmin = true;

    document.getElementById("admin").style.display = "block";
    document.getElementById("adminStatus").textContent = "Admin logged in";

    renderPlayerList();
    await loadBans();
  } catch (error) {
    alert("Admin login failed: " + error.message);
  }
}

async function loadBans() {
  try {
    const result = await adminAction("list-bans");

    const el = document.getElementById("banList");
    el.innerHTML = "<h3>Active bans</h3>";

    (result.bans || []).forEach(b => {
      const p = document.createElement("p");

      p.textContent =
        b.player_name + " – until " +
        new Date(b.expires_at).toLocaleString("en-GB");

      el.appendChild(p);
    });
  } catch (error) {
    document.getElementById("banList").textContent = error.message;
  }
}

async function banSelectedPlayer() {
  if (!selectedPlayer) {
    return alert("Select a player first.");
  }

  let minutes = document.getElementById("banDuration").value;

  if (minutes === "custom") {
    minutes = Number(document.getElementById("customMinutes").value);
  } else {
    minutes = Number(minutes);
  }

  if (!Number.isInteger(minutes) || minutes < 1 || minutes > 525600) {
    return alert("Choose a valid duration.");
  }

  try {
    await adminAction("ban-player",{
      playerId:selectedPlayer.playerId,
      playerName:selectedPlayer.name,
      durationMinutes:minutes,
      reason:document.getElementById("banReason").value
    });

    alert("Player banned.");
    await loadBans();
  } catch (error) {
    alert("Ban failed: " + error.message);
  }
}

async function unbanSelectedPlayer() {
  if (!selectedPlayer) {
    return alert("Select a player first.");
  }

  try {
    await adminAction("unban-player",{
      playerId:selectedPlayer.playerId
    });

    alert("Ban removed.");
    await loadBans();
  } catch (error) {
    alert(error.message);
  }
}


/* BUTTONS */

document.getElementById("trainingBtn").onclick = () => {
  selectMode("training");
};

document.getElementById("multiplayerBtn").onclick = () => {
  selectMode("multiplayer");
};

document.getElementById("playBtn").onclick = startGame;

document.getElementById("restartBtn").onclick = async () => {
  if (gameRunning) {
    await endGame();
  }

  gameOver = false;
  gameRunning = false;
  runId = null;

  document.getElementById("menu").style.display = "block";

  bird = {x:85,y:260,vy:0};
  pipes = [];
  score = 0;

  draw();
};

document.getElementById("banBtn").onclick = banSelectedPlayer;
document.getElementById("unbanBtn").onclick = unbanSelectedPlayer;
document.getElementById("refreshBans").onclick = loadBans;

document.getElementById("adminLogout").onclick = () => {
  adminCode = null;
  isAdmin = false;
  selectedPlayer = null;

  document.getElementById("admin").style.display = "none";
};

document.getElementById("soundBtn").onclick = () => {
  soundOn = !soundOn;

  document.getElementById("soundBtn").textContent =
    "Sound: " + (soundOn ? "On" : "Off");

  if (soundOn) playSound(500);
};


/* CONTROLS */

canvas.addEventListener("pointerdown",flap);

document.addEventListener("keydown",e => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    flap();
  }

  if (e.ctrlKey && e.altKey && e.code === "KeyQ") {
    loginAdmin();
  }
});


/* INITIALIZATION */

connectMultiplayer();

loadLeaderboard();

checkBan().catch(() => {
  setStatus("Server temporarily unavailable.");
});

update();
</script>
</body>
</html>
