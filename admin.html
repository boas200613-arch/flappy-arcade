
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Arcade - Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 25px 15px;
      background: #080f1d;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
    }

    h1 { color: #00e5ff; }
    h2 { color: #00e5ff; }

    .panel {
      background: #111d30;
      border: 1px solid #263b56;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 8px;
      border: 1px solid #344b68;
      background: #091525;
      color: white;
      font-size: 15px;
    }

    button {
      background: #00bcd4;
      color: #00131a;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #45eafa; }

    button.danger {
      background: #e53935;
      color: white;
    }

    button.secondary {
      background: #344b68;
      color: white;
    }

    .small-button {
      width: auto;
      padding: 8px 12px;
      margin-right: 5px;
    }

    .hidden { display: none !important; }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin: 12px 0;
      background: #1d344c;
      overflow-wrap: anywhere;
    }

    .error { background: #542323; }
    .success { background: #17452e; }

    .score-item, .ban-item {
      background: #0a1728;
      border: 1px solid #263b56;
      border-radius: 10px;
      padding: 13px;
      margin: 10px 0;
      overflow-wrap: anywhere;
    }

    .score-item strong, .ban-item strong {
      color: #00e5ff;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .actions button { width: auto; }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
    }

    .checkbox-row input {
      width: auto;
      margin: 0;
    }

    .muted { color: #a9bad0; font-size: 13px; }

    @media (max-width: 600px) {
      body { padding: 12px; }
      .panel { padding: 14px; }
    }
  </style>
</head>

<body>
<div class="container">

  <h1>FLAPPY ARCADE</h1>
  <p class="muted">Beheerderspaneel</p>

  <div id="loginPanel" class="panel">
    <h2>Admin login</h2>
    <p>Voer je beheerderscode in.</p>

    <input id="adminCodeInput" type="password"
           placeholder="Admin code"
           autocomplete="current-password">

    <button id="loginButton">Inloggen</button>
    <div id="loginMessage" class="message hidden"></div>
  </div>

  <div id="adminPanel" class="hidden">

    <div class="panel">
      <h2>Dashboard</h2>
      <p>Je bent ingelogd op het Flappy Arcade-beheer.</p>
      <button id="refreshButton">Alles vernieuwen</button>
      <button id="logoutButton" class="secondary">Uitloggen</button>
      <div id="statusMessage" class="message hidden"></div>
    </div>

    <div class="panel">
      <h2>Score toevoegen</h2>
      <input id="newName" type="text" maxlength="30"
             placeholder="Spelersnaam">
      <input id="newScore" type="number" min="0"
             placeholder="Score">
      <button id="addScoreButton">Score toevoegen</button>
    </div>

    <div class="panel">
      <h2>Scores beheren</h2>
      <div id="scoresList">Scores laden...</div>
    </div>

    <div class="panel">
      <h2>Spelernaam blokkeren</h2>

      <input id="banName" type="text" maxlength="30"
             placeholder="Spelersnaam">

      <select id="banDuration">
        <option value="10">10 minuten</option>
        <option value="60">1 uur</option>
        <option value="1440">1 dag</option>
        <option value="10080">7 dagen</option>
        <option value="43200">30 dagen</option>
      </select>

      <div class="checkbox-row">
        <input id="permanentBan" type="checkbox">
        <label for="permanentBan">Permanent blokkeren</label>
      </div>

      <input id="banReason" type="text" maxlength="200"
             placeholder="Reden (optioneel)">

      <button id="banButton" class="danger">Naam blokkeren</button>
    </div>

    <div class="panel">
      <h2>Geblokkeerde namen</h2>
      <div id="nameBansList">Blokkeringen laden...</div>
    </div>

    <div class="panel">
      <h2>Geblokkeerde spelers</h2>
      <div id="playerBansList">Blokkeringen laden...</div>
    </div>

  </div>
</div>

<script>
  const SUPABASE_URL = "https://ilgdnvtdmzjrclybbexi.supabase.co";
  const SUPABASE_KEY = "sb_publishable_6kZmesu_W4jgVmDKDw6v8Q_Y5SlesV0";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  let adminCode = "";

  const $ = id => document.getElementById(id);

  function showMessage(element, message, type = "") {
    element.textContent = message;
    element.className = "message" + (type ? " " + type : "");
    element.classList.remove("hidden");
  }

  function hideMessage(element) {
    element.classList.add("hidden");
  }

  async function api(action, extra = {}) {
    const { data, error } = await db.functions.invoke("admin-boas", {
      body: {
        action,
        adminCode,
        ...extra
      }
    });

    if (error) {
      let details = error.message || "Er ging iets mis.";

      try {
        const response = await error.context.clone().json();
        if (response.error) details = response.error;
      } catch (_) {}

      throw new Error(details);
    }

    if (data && data.error) {
      throw new Error(data.error);
    }

    return data || {};
  }

  function makeText(tag, value) {
    const element = document.createElement(tag);
    element.textContent = value == null ? "" : String(value);
    return element;
  }

  function makeButton(label, className, callback) {
    const button = document.createElement("button");
    button.textContent = label;
    button.className = "small-button " + (className || "");
    button.addEventListener("click", callback);
    return button;
  }

  async function login() {
    const code = $("adminCodeInput").value.trim();

    if (!code) {
      showMessage($("loginMessage"), "Vul je admincode in.", "error");
      return;
    }

    $("loginButton").disabled = true;
    $("loginButton").textContent = "Controleren...";

    try {
      adminCode = code;
      await api("verify");

      $("loginPanel").classList.add("hidden");
      $("adminPanel").classList.remove("hidden");
      $("adminCodeInput").value = "";

      showMessage($("statusMessage"), "Succesvol ingelogd.", "success");
      await refreshAll();

    } catch (error) {
      adminCode = "";
      showMessage($("loginMessage"), error.message, "error");
    } finally {
      $("loginButton").disabled = false;
      $("loginButton").textContent = "Inloggen";
    }
  }

  function logout() {
    adminCode = "";
    $("adminPanel").classList.add("hidden");
    $("loginPanel").classList.remove("hidden");
    $("adminCodeInput").value = "";
    hideMessage($("statusMessage"));
    showMessage($("loginMessage"), "Je bent uitgelogd.");
  }

  async function refreshAll() {
    $("scoresList").textContent = "Scores laden...";
    $("nameBansList").textContent = "Blokkeringen laden...";
    $("playerBansList").textContent = "Blokkeringen laden...";

    try {
      await Promise.all([
        loadScores(),
        loadBans()
      ]);

      showMessage($("statusMessage"), "Gegevens vernieuwd.", "success");
    } catch (error) {
      showMessage($("statusMessage"), error.message, "error");
    }
  }

  async function loadScores() {
    const data = await api("list-scores");
    const scores = data.scores || data.data || [];
    const container = $("scoresList");

    container.replaceChildren();

    if (!scores.length) {
      container.textContent = "Er zijn nog geen scores.";
      return;
    }

    scores.forEach(score => {
      const item = document.createElement("div");
      item.className = "score-item";

      const info = document.createElement("div");
      info.append(
        makeText("strong", score.name || "Onbekend"),
        makeText("div", "Score: " + score.score),
        makeText("div", "ID: " + score.id)
      );

      const actions = document.createElement("div");
      actions.className = "actions";

      actions.append(
        makeButton("Bewerken", "", () => editScore(score)),
        makeButton("Verwijderen", "danger", () => deleteScore(score.id))
      );

      item.append(info, actions);
      container.append(item);
    });
  }

  async function addScore() {
    const name = $("newName").value.trim();
    const score = Number($("newScore").value);

    if (!name || !Number.isInteger(score) || score < 0) {
      showMessage($("statusMessage"),
        "Vul een geldige naam en score in.", "error");
      return;
    }

    try {
      await api("add-score", { name, score });
      $("newName").value = "";
      $("newScore").value = "";
      await loadScores();
      showMessage($("statusMessage"), "Score toegevoegd.", "success");
    } catch (error) {
      showMessage($("statusMessage"), error.message, "error");
    }
  }

  async function editScore(score) {
    const name = prompt("Nieuwe spelersnaam:", score.name || "");
    if (name === null) return;

    const scoreValue = prompt("Nieuwe score:", score.score);
    if (scoreValue === null) return;

    const cleanName = name.trim();
    const newScore = Number(scoreValue);

    if (!cleanName || !Number.isInteger(newScore) || newScore < 0) {
      showMessage($("statusMessage"),
        "Ongeldige naam of score.", "error");
      return;
    }

    try {
      await api("update-score", {
        id: score.id,
        name: cleanName,
        score: newScore
      });

      await loadScores();
      showMessage($("statusMessage"), "Score bijgewerkt.", "success");
    } catch (error) {
      showMessage($("statusMessage"), error.message, "error");
    }
  }

  async function deleteScore(id) {
    if (!confirm("Weet je zeker dat je deze score wilt verwijderen?")) {
      return;
    }

    try {
      await api("delete-score", { id });
      await loadScores();
      showMessage($("statusMessage"), "Score verwijderd.", "success");
    } catch (error) {
      showMessage($("statusMessage"), error.message, "error");
    }
  }

  async function banName() {
    const playerName = $("banName").value.trim();
    const permanent = $("permanentBan").checked;
    const durationMinutes = Number($("banDuration").value);
    const reason = $("banReason").value.trim();

    if (!playerName) {
      showMessage($("statusMessage"),
        "Vul een spelersnaam in.", "error");
      return;
    }

    try {
      await api("ban-name", {
        playerName,
        durationMinutes,
        permanent,
        reason
      });

      $("banName").value = "";
      $("banReason").value = "";
      $("permanentBan").checked = false;

      await loadBans();
      showMessage($("statusMessage"),
        "Spelersnaam geblokkeerd.", "success");
    } catch (error) {
      showMessage($("statusMessage"), error.message, "error");
    }
  }

  async function loadBans() {
    const data = await api("list-bans");

    const nameBans = data.nameBans || [];
    const playerBans = data.bans || [];

    renderNameBans(nameBans);
    renderPlayerBans(playerBans);
  }

  function renderNameBans(bans) {
    const container = $("nameBansList");
    container.replaceChildren();

    if (!bans.length) {
      container.textContent = "Geen geblokkeerde namen.";
      return;
    }

    bans.forEach(ban => {
      const item = document.createElement("div");
      item.className = "ban-item";

      item.append(
        makeText("strong", ban.player_name || "Onbekend"),
        makeText("div", "Reden: " + (ban.reason || "Geen reden opgegeven")),
        makeText("div", "Verloopt: " + (ban.expires_at || "Permanent"))
      );

      const actions = document.createElement("div");
      actions.className = "actions";

      actions.append(
        makeButton("Deblokkeren", "danger", async () => {
          if (!confirm("Deze naam deblokkeren?")) return;

          try {
            await api("unban-name", {
              playerName: ban.player_name
            });
            await loadBans();
            showMessage($("statusMessage"),
              "Naam gedeblokkeerd.", "success");
          } catch (error) {
            showMessage($("statusMessage"), error.message, "error");
          }
        })
      );

      item.append(actions);
      container.append(item);
    });
  }

  function renderPlayerBans(bans) {
    const container = $("playerBansList");
    container.replaceChildren();

    if (!bans.length) {
      container.textContent = "Geen geblokkeerde spelers.";
      return;
    }

    bans.forEach(ban => {
      const item = document.createElement("div");
      item.className = "ban-item";

      item.append(
        makeText("strong", ban.player_name || "Onbekend"),
        makeText("div", "Speler-ID: " + (ban.player_id || "")),
        makeText("div", "Reden: " + (ban.reason || "Geen reden opgegeven")),
        makeText("div", "Verloopt: " + (ban.expires_at || "Permanent"))
      );

      const actions = document.createElement("div");
      actions.className = "actions";

      actions.append(
        makeButton("Speler deblokkeren", "danger", async () => {
          if (!confirm("Deze speler deblokkeren?")) return;

          try {
            await api("unban-player", {
              playerId: ban.player_id
            });
            await loadBans();
            showMessage($("statusMessage"),
              "Speler gedeblokkeerd.", "success");
          } catch (error) {
            showMessage($("statusMessage"), error.message, "error");
          }
        })
      );

      item.append(actions);
      container.append(item);
    });
  }

  $("loginButton").addEventListener("click", login);
  $("adminCodeInput").addEventListener("keydown", event => {
    if (event.key === "Enter") login();
  });

  $("logoutButton").addEventListener("click", logout);
  $("refreshButton").addEventListener("click", refreshAll);
  $("addScoreButton").addEventListener("click", addScore);
  $("banButton").addEventListener("click", banName);
</script>
</body>
</html>
