
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flappy Arcade</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;text-align:center}
h1{margin:18px 0;color:#70d6ff}
#game{display:block;width:min(94vw,400px);height:auto;margin:15px auto;background:#8ed8ff;border:4px solid #fff;border-radius:14px;touch-action:manipulation}
.panel{background:#1c293b;padding:16px;margin:12px auto;border-radius:12px;width:min(94%,430px)}
input,button,select{padding:11px;border:0;border-radius:8px;margin:4px;font-size:15px}
input{width:190px}
button{background:#70d6ff;color:#101827;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.1)}
#status{color:#a9e7ff;min-height:22px}
#admin{display:none}
#players{text-align:left;max-height:180px;overflow:auto}
.player{padding:8px;margin:4px;background:#293b52;border-radius:7px;cursor:pointer}
.player.selected{outline:2px solid #70d6ff}
.small{font-size:12px;color:#b7c5d8}
</style>
</head>
<body>
<h1>🐤 Flappy Arcade</h1>

<div class="panel" id="menu">
  <input id="playerName" maxlength="10" placeholder="Jouw naam">
  <button id="playBtn">SPELEN</button>
  <p id="status">Verbinden...</p>
  <h3>🏆 Online leaderboard</h3>
  <div id="leaderboard">Laden...</div>
</div>

<canvas id="game" width="400" height="560"></canvas>

<div class="panel">
  <button id="restartBtn">Opnieuw spelen</button>
  <button id="soundBtn">Geluid: uit</button>
  <p class="small">Tik of druk op spatie om te vliegen.</p>
</div>

<div class="panel" id="admin">
  <h2>Adminpaneel</h2>
  <p id="adminStatus">Admin actief</p>
  <h3>Actieve spelers</h3>
  <div id="players">Geen spelers online</div>
  <div id="selectedInfo">Selecteer een speler.</div>
  <h3>Speler tijdelijk verbannen</h3>
  <select id="banDuration">
    <option value="5">5 minuten</option>
    <option value="60">1 uur</option>
    <option value="1440">24 uur</option>
    <option value="10080">7 dagen</option>
    <option value="43200">30 dagen</option>
    <option value="custom">Aangepast</option>
  </select>
  <input id="customMinutes" type="number" min="1" max="525600" placeholder="Minuten">
  <input id="banReason" maxlength="120" placeholder="Reden (optioneel)">
  <br>
  <button id="banBtn">Speler verbannen</button>
  <button id="unbanBtn">Ban opheffen</button>
  <button id="refreshBans">Bans vernieuwen</button>
  <div id="banList"></div>
  <button id="adminLogout">Uitloggen</button>
</div>

<script>
const SUPABASE_URL = "https://ilgdnvtdmzjrclybbexi.supabase.co";
const SUPABASE_KEY = "sb_publishable_6kZmesu_W4jgVmDKDw6v8Q_Y5SlesV0";
const FUNCTION_URL = SUPABASE_URL + "/functions/v1/admin-boas";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");

const colors = ["#ff595e","#ffca3a","#8ac926","#1982c4","#c77dff",
                "#ff924c","#00f5d4","#f15bb5","#ffffff"];

const playerId = (() => {
  let id = localStorage.getItem("flappy_player_id");
  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem("flappy_player_id", id);
  }
  return id;
})();

const playerColor = localStorage.getItem("flappy_player_color") ||
  colors[Math.floor(Math.random() * colors.length)];
localStorage.setItem("flappy_player_color", playerColor);

let playerName = "";
let channel = null;
let remotePlayers = [];
let selectedPlayer = null;
let adminCode = null;
let isAdmin = false;
let gameRunning = false;
let gameOver = false;
let score = 0;
let pipes = [];
let lastPipe = 0;
let soundOn = false;
let runStartedAt = 0;
let runId = null;
let bird = {x:85,y:260,vy:0};
const gravity = 0.42;
const jump = -7.4;

async function callFunction(action, extra = {}) {
  const response = await fetch(FUNCTION_URL, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({action, ...extra})
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || "Serverfout");
  return data;
}

function setStatus(message) {
  statusEl.textContent = message;
}

async function checkBan() {
  const result = await callFunction("check-ban", {playerId});
  if (result.banned) {
    setStatus("Je bent tijdelijk verbannen tot " +
      new Date(result.expiresAt).toLocaleString("nl-BE"));
    document.getElementById("playBtn").disabled = true;
    return true;
  }
  document.getElementById("playBtn").disabled = false;
  return false;
}

async function connectMultiplayer() {
  channel = db.channel("flappy-live", {
    config: {presence: {key: playerId}}
  });

  channel.on("presence", {event:"sync"}, () => {
    const state = channel.presenceState();
    remotePlayers = [];
    for (const key of Object.keys(state)) {
      for (const item of state[key]) {
        if (item.playerId !== playerId && item.playing) {
          remotePlayers.push(item);
        }
      }
    }
    renderPlayerList();
  });

  channel.subscribe(async state => {
    if (state === "SUBSCRIBED") {
      setStatus("Online – multiplayer verbonden");
      await publishPresence();
    }
  });
}

async function publishPresence() {
  if (!channel) return;
  await channel.track({
    playerId,
    name: playerName || "Speler",
    color: playerColor,
    x: bird.x,
    y: bird.y,
    score,
    playing: gameRunning,
    updatedAt: Date.now()
  });
}

function renderPlayerList() {
  if (!isAdmin) return;
  const container = document.getElementById("players");
  container.innerHTML = "";

  if (!remotePlayers.length) {
    container.textContent = "Geen andere actieve spelers.";
    return;
  }

  remotePlayers.forEach(p => {
    const item = document.createElement("div");
    item.className = "player" +
      (selectedPlayer?.playerId === p.playerId ? " selected" : "");
    item.textContent = p.name + " – score: " + p.score;
    item.style.borderLeft = "7px solid " + p.color;
    item.onclick = () => {
      selectedPlayer = p;
      document.getElementById("selectedInfo").textContent =
        "Geselecteerd: " + p.name + " | ID: " + p.playerId +
        " | Score: " + p.score;
      renderPlayerList();
    };
    container.appendChild(item);
  });
}

async function updatePresence() {
  if (!channel) return;
  await channel.track({
    playerId,
    name: playerName || "Speler",
    color: playerColor,
    x: bird.x,
    y: bird.y,
    score,
    playing: gameRunning,
    updatedAt: Date.now()
  });
}

async function startGame() {
  if (gameRunning) return;
  if (await checkBan()) return;

  playerName = document.getElementById("playerName").value
    .trim().replace(/[^a-zA-Z0-9_-]/g, "").slice(0,10).toUpperCase();

  if (!playerName) {
    setStatus("Vul eerst een naam in.");
    return;
  }

  try {
    const result = await callFunction("start-run", {playerId});
    runId = result.runId;
  } catch (error) {
    setStatus("Starten mislukt: " + error.message);
    return;
  }

  document.getElementById("menu").style.display = "none";
  bird = {x:85,y:260,vy:0};
  score = 0;
  pipes = [];
  lastPipe = 0;
  gameOver = false;
  gameRunning = true;
  runStartedAt = Date.now();
  await updatePresence();
}

function endGame() {
  if (!gameRunning) return;
  gameRunning = false;
  gameOver = true;
  updatePresence();
  if (runId) {
    callFunction("finish-run", {
      playerId, runId, name: playerName, score
    }).then(() => loadLeaderboard())
      .catch(err => setStatus("Score niet opgeslagen: " + err.message));
  }
  runId = null;
  document.getElementById("menu").style.display = "block";
  setStatus("Game over! Score: " + score);
}

function flap() {
  if (!gameRunning) return;
  bird.vy = jump;
}

function addPipe() {
  const gap = 155;
  const top = 60 + Math.random() * 220;
  pipes.push({x:410,top,gap,passed:false});
}

function drawBird(x,y,color,label) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x,y,13,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle = "#172033";
  ctx.beginPath();
  ctx.arc(x+4,y-4,2.5,0,Math.PI*2);
  ctx.fill();
  if (label) {
    ctx.fillStyle = "#102033";
    ctx.font = "11px Arial";
    ctx.fillText(label,x-20,y-19);
  }
}

function draw() {
  ctx.clearRect(0,0,400,560);
  ctx.fillStyle = "#8ed8ff";
  ctx.fillRect(0,0,400,560);

  ctx.fillStyle = "#d8f5ff";
  ctx.beginPath();
  ctx.arc(70,90,28,0,Math.PI*2);
  ctx.arc(100,90,22,0,Math.PI*2);
  ctx.arc(125,90,28,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#6fc34a";
  ctx.fillRect(0,520,400,40);

  pipes.forEach(p => {
    ctx.fillStyle = "#269b48";
    ctx.fillRect(p.x,0,55,p.top);
    ctx.fillRect(p.x,p.top+p.gap,55,520-(p.top+p.gap));
    ctx.fillStyle = "#167c38";
    ctx.fillRect(p.x-5,p.top-16,65,16);
    ctx.fillRect(p.x-5,p.top+p.gap,65,16);
  });

  if (gameRunning || gameOver) drawBird(bird.x,bird.y,playerColor,playerName);

  remotePlayers.forEach(p => {
    drawBird(Number(p.x)||85,Number(p.y)||260,p.color||"#fff",p.name);
  });

  ctx.fillStyle = "#102033";
  ctx.font = "bold 30px Arial";
  ctx.textAlign = "center";
  ctx.fillText(String(score),200,45);

  if (!gameRunning && !gameOver) {
    ctx.font = "bold 23px Arial";
    ctx.fillText("FLAPPY ARCADE",200,250);
    ctx.font = "16px Arial";
    ctx.fillText("Druk op SPELEN",200,285);
  }

  if (gameOver) {
    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.fillRect(0,0,400,560);
    ctx.fillStyle = "white";
    ctx.font = "bold 34px Arial";
    ctx.fillText("GAME OVER",200,260);
    ctx.font = "22px Arial";
    ctx.fillText("Score: " + score,200,300);
  }
}

function update() {
  if (gameRunning) {
    bird.vy += gravity;
    bird.y += bird.vy;

    if (Date.now() - lastPipe > 1500) {
      addPipe();
      lastPipe = Date.now();
    }

    pipes.forEach(p => {
      p.x -= 2.5;

      if (!p.passed && p.x + 55 < bird.x) {
        p.passed = true;
        score++;
      }

      const withinX = bird.x + 11 > p.x && bird.x - 11 < p.x + 55;
      const outsideGap = bird.y - 11 < p.top ||
        bird.y + 11 > p.top + p.gap;

      if (withinX && outsideGap) endGame();
    });

    pipes = pipes.filter(p => p.x > -70);

    if (bird.y > 508 || bird.y < 0) endGame();

    if (Math.random() < 0.08) updatePresence();
  }
  draw();
  requestAnimationFrame(update);
}

async function loadLeaderboard() {
  try {
    const {data,error} = await db.from("flappy_scores")
      .select("name,score")
      .order("score",{ascending:false})
      .limit(5);
    if (error) throw error;

    const el = document.getElementById("leaderboard");
    el.innerHTML = "";
    (data || []).forEach((s,i) => {
      const row = document.createElement("p");
      row.textContent = (i+1) + ". " + s.name + " – " + s.score;
      el.appendChild(row);
    });
    if (!data?.length) el.textContent = "Nog geen scores.";
  } catch (error) {
    document.getElementById("leaderboard").textContent =
      "Leaderboard niet beschikbaar.";
  }
}

async function adminAction(action, extra={}) {
  if (!adminCode) throw new Error("Niet ingelogd.");
  return callFunction(action,{adminCode,...extra});
}

async function loginAdmin() {
  const code = prompt("Geef de admincode:");
  if (!code) return;
  try {
    await callFunction("verify",{adminCode:code});
    adminCode = code;
    isAdmin = true;
    document.getElementById("admin").style.display = "block";
    document.getElementById("adminStatus").textContent = "Admin ingelogd";
    renderPlayerList();
    await loadBans();
  } catch (error) {
    alert("Adminlogin mislukt: " + error.message);
  }
}

async function loadBans() {
  try {
    const result = await adminAction("list-bans");
    const el = document.getElementById("banList");
    el.innerHTML = "<h3>Actieve bans</h3>";
    (result.bans || []).forEach(b => {
      const p = document.createElement("p");
      p.textContent = b.player_name + " – tot " +
        new Date(b.expires_at).toLocaleString("nl-BE");
      el.appendChild(p);
    });
  } catch (error) {
    document.getElementById("banList").textContent = error.message;
  }
}

async function banSelectedPlayer() {
  if (!selectedPlayer) return alert("Selecteer eerst een speler.");
  let minutes = document.getElementById("banDuration").value;
  if (minutes === "custom") {
    minutes = Number(document.getElementById("customMinutes").value);
  } else {
    minutes = Number(minutes);
  }
  if (!Number.isInteger(minutes) || minutes < 1 || minutes > 525600) {
    return alert("Kies een geldige duurtijd.");
  }
  try {
    await adminAction("ban-player",{
      playerId:selectedPlayer.playerId,
      playerName:selectedPlayer.name,
      durationMinutes:minutes,
      reason:document.getElementById("banReason").value
    });
    alert("Speler verbannen.");
    await loadBans();
  } catch (error) {
    alert("Ban mislukt: " + error.message);
  }
}

async function unbanSelectedPlayer() {
  if (!selectedPlayer) return alert("Selecteer eerst een speler.");
  try {
    await adminAction("unban-player",{playerId:selectedPlayer.playerId});
    alert("Ban opgeheven.");
    await loadBans();
  } catch (error) {
    alert(error.message);
  }
}

document.getElementById("playBtn").onclick = startGame;
document.getElementById("restartBtn").onclick = () => {
  if (gameRunning) endGame();
  gameOver = false;
  document.getElementById("menu").style.display = "block";
  draw();
};
document.getElementById("banBtn").onclick = banSelectedPlayer;
document.getElementById("unbanBtn").onclick = unbanSelectedPlayer;
document.getElementById("refreshBans").onclick = loadBans;
document.getElementById("adminLogout").onclick = () => {
  adminCode = null;
  isAdmin = false;
  selectedPlayer = null;
  document.getElementById("admin").style.display = "none";
};
document.getElementById("soundBtn").onclick = () => {
  soundOn = !soundOn;
  document.getElementById("soundBtn").textContent =
    "Geluid: " + (soundOn ? "aan" : "uit");
};

canvas.addEventListener("pointerdown",flap);
document.addEventListener("keydown",e => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    flap();
  }
  if (e.ctrlKey && e.altKey && e.code === "KeyQ") loginAdmin();
});

connectMultiplayer();
loadLeaderboard();
checkBan().catch(() => setStatus("Server tijdelijk niet bereikbaar."));
update();
</script>
</body>
</html>
